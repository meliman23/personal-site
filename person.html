<!doctype html>
<html>
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>Profile</title>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/atier.css">
</head>
<body>
  <main class="container person-wrap">
    <div id="person-root">Loading…</div>
  </main>

  <script>
    function qs(key){ return new URLSearchParams(location.search).get(key) }
    const id = qs('id');

    fetch('/online-neighbors.json')
      .then(r => r.json())
      .then(data => {
        const person = data.find(p => p.id === id);
        const root = document.getElementById('person-root');

        if (!person){
          root.innerHTML = '<p>Profile not found. <a href="/index.html">Back to gallery</a></p>';
          return;
        }

        root.innerHTML = `
          <article class="person-card" aria-label="${person.name} profile">
            <img class="big-avatar" src="${person.avatar}" alt="${person.name} avatar">
            <div class="info">
              <h1>${person.name}</h1>
              <div class="meta">${person.role} • <span class="badge">${person.tier}</span></div>
              <p>${person.bio || ''}</p>

              <p style="margin-top:12px">
                <a href="${person.tt}" target="_blank" rel="noopener">TikTok / Link</a> •
                <a href="/atier.html">Back to neighborhood</a>
              </p>
            </div>
          </article>
        `;
      })
      .catch(err => {
        document.getElementById('person-root').innerText = 'Failed to load profile.';
        console.error(err);
      });
  </script>
</body>
</html>
