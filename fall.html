<script>
  const canvas = document.getElementById('particleCanvas');
  const ctx = canvas.getContext('2d');

  let windowOffsetY = 0; // controls vertical movement of windows

  function resize() {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
  }
  window.addEventListener('resize', resize);
  resize();

  class Particle {
    constructor() {
      this.reset();
    }
    reset() {
      this.x = Math.random() * canvas.width;
      this.y = canvas.height + Math.random() * 100;
      this.size = Math.random() * 3 + 1;
      this.speed = Math.random() * 9 + 2.5;
      this.opacity = Math.random() * 0.5 + 0.3;
      this.swing = (Math.random() - 0.5) * 1.5;
      this.angle = Math.random() * Math.PI * 2;
    }
    update() {
      this.y -= this.speed;
      this.angle += 0.02;
      this.x += Math.sin(this.angle) * this.swing;
      if (this.y < -this.size) this.reset();
    }
    draw() {
      ctx.fillStyle = `rgba(255,255,255,${this.opacity})`;
      ctx.beginPath();
      ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
      ctx.fill();
    }
  }

  // Draw building silhouette on the right side of the screen
  function drawBuilding() {
    const baseHeight = 1620;
    const buildingWidth = 600;
    const windowWidth = 50;
    const windowHeight = 70;
    const spacingX = 100;
    const spacingY = 150;

    // Move windows upward and wrap around
    windowOffsetY -= 9.5;
    if (windowOffsetY < -spacingY) windowOffsetY = 0;

    // Building base rectangle on the right
    ctx.fillStyle = 'rgba(10, 10, 10, 0.8)';
    ctx.fillRect(canvas.width - buildingWidth, canvas.height - baseHeight, buildingWidth, baseHeight);

    // Draw windows moving upward with offset
    for (let x = canvas.width - buildingWidth + 10; x < canvas.width - 10; x += spacingX) {
      for (let y = canvas.height - baseHeight + spacingY + windowOffsetY; y < canvas.height - 20 + spacingY; y += spacingY) {
        ctx.fillStyle = 'rgba(200, 100, 110, 0.3)';
        ctx.fillRect(x, y, windowWidth, windowHeight);
      }
    }
  }

  const particles = [];
  for (let i = 0; i < 100; i++) {
    particles.push(new Particle());
  }

  function animate() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    drawBuilding();
    particles.forEach(p => {
      p.update();
      p.draw();
    });
    requestAnimationFrame(animate);
  }

  animate();
</script>
