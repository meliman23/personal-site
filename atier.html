<!doctype html>
<html>
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>Online Neighbors</title>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/atier.css">
</head>
<body>
    <header class="header">
            <img src="./pictures/girl pics/catgirl.png" alt="" class="pokemon">
            <div class="col">
                <h1 >Online nieghborhood </h1>
                <p></p>
            </div>

            <img class="pokemon" src="./pictures/pokemon/mewtwo-sprite.gif" alt="Drifblim">
    </header>
<div class="spot" ><p>I am so greatful for everyone!
  my words cant explain how much but thanks <3

</p>
<iframe data-testid="embed-iframe" style="border-radius:12px" src="https://open.spotify.com/embed/track/0VbuSgCWeGkK9rxmL4W3Xa?utm_source=generator" width="100%" height="152" frameBorder="0" allowfullscreen="" allow="autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture" loading="lazy"></iframe>
</div>
  <main class="container">
    <div id="grid" class="grid" aria-live="polite">
    </div>
    <div class="note">
      If anyone wants removed, DM me on TikTok (I will remove them on request.)
    </div>
  </main>

  <script>
    // Load and render cards
    fetch('/online-neighbors.json')
      .then(r => r.json())
      .then(data => {
        const grid = document.getElementById('grid');

        // sort by tier (S A B C) then name
        const order = { 'S': 0, 'A': 1, 'B': 2, 'C': 3 };
        data.sort((a,b)=>{
          const ta = order[a.tier] ?? 9;
          const tb = order[b.tier] ?? 9;
          if (ta !== tb) return ta - tb;
          return a.name.localeCompare(b.name);
        });

        data.forEach(person => {
          const el = document.createElement('a');
          el.href = person.link || (`/person.html?id=${encodeURIComponent(person.id)}`);
          el.className = 'card';
          el.setAttribute('aria-label', person.name + ' card');

          el.innerHTML = `
            <div class="top">
              <img class="avatar" src="${person.avatar}" alt="${person.name} avatar">
              <div>
                <h3>${person.name}</h3>
                <div class="meta">${person.role} • <span class="badge">${person.tier}</span></div>
              </div>
            </div>
            <div class="bio">${person.bio || ''}</div>
          `;

          grid.appendChild(el);
        });
      })
      .catch(err => {
        document.getElementById('grid').innerText = 'Failed to load neighbors.';
        console.error(err);
      });
  </script>
</body>
</html>
