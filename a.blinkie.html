      <div id="image-container"></div>

      <script>
        // Array of image file names (assuming they're in an "images" folder)
        const imageFiles = ["19.gif","20online.gif","blinkie/1ai.gif"];

        // Reference to the container where images will be added
        const container = document.getElementById("image-container");

        // Loop through the image array
        imageFiles.forEach(file => {
            const img = document.createElement("img"); // Create img element
            img.src = `blinkie/${file}`; // Set the src attribute
            img.alt = file; // Add alt text
            img.style.width = "200px"; // Example styling
            img.style.margin = "10px"; 

            container.appendChild(img); // Add to the page
        });
    </script>
