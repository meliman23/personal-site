<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chibimon</title>
  <link rel="stylesheet" href="./css/index.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Source+Code+Pro&display=swap" rel="stylesheet">

</head>

<body>
   <img class="chibi" src="./blinkie/14chibimon.gif" alt="Chibimon">
  <div class="background-image">
   
    <div class="row girl-container">
      <a href="./m.meta.html">
        <img src="./pictures/girl pics/green dress.png" class="girl" alt="Girl">
      </a>
      <img id="pokemon" class="pokemon" src="" alt="Random Pokémon">
    </div>
  </div>
  <img src="./pictures/stuff/cyberlover.gif" class=" mobile" alt="Girl">

  <div class="textbox" onclick="nextText()">Oh you found my website...<i>(click to continue)</i> </div>

  <div class="row hidden" id="buttons">
    <button class="btnn">
      <a href="./index2.html">
        <img src="./blinkie/14chibimon.gif" alt="">
      </a>
    </button>
    
  </div>

  

  <script>
    //loops though images on load
    const pokemonImages = [
      'pictures/pokemon/dragonite.gif',
      'pictures/pokemon/drifblim.gif',
      'pictures/pokemon/espeon.gif',
      'pictures/pokemon/roserade-f.gif',
      'pictures/pokemon/volcarona.gif',
      'pictures/pokemon/hydreigon.gif'
    ];
    const randomPokemon = pokemonImages[Math.floor(Math.random() * pokemonImages.length)];

    document.getElementById('pokemon').src = randomPokemon;

    // text box js
    const texts = [
      "you should look at my site on desktop ",
      "Theres some cool stuff here ...   ",
      "Heres the front page ⤵️",
      "you clicked again? on accident? ",
      "Click on me (secret page )",
      " if your on mobile it wont work "
    ];


    let textIndex = 0;
    function nextText() {
      textIndex = (textIndex + 1) % texts.length;
      document.querySelector('.textbox').innerText = texts[textIndex];
      document.getElementById('buttons').classList.toggle('hidden', textIndex !== 2);
    }
  </script>
</body>

</html>
