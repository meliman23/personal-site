<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Piano Room</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Playfair+Display&display=swap');

    /* Reset & base */
    * {
      box-sizing: border-box;
    }
    body {
      margin: 0;
      background-color: #12110e; /* Very dark */
      color: #d4af37; /* Gold */
      font-family: 'Playfair Display', serif;
      line-height: 1.6;
      display: flex;
      flex-direction: column;
      min-height: 100vh;
    }
    a {
      color: #d4af37;
      text-decoration: none;
    }
    a:hover {
      text-decoration: underline;
    }

    /* Header */
    header {
      padding: 2rem 1rem;
      text-align: center;
      border-bottom: 1px solid #d4af37;
    }
    header h1 {
      margin: 0;
      font-size: 3rem;
      font-weight: 700;
      letter-spacing: 0.1em;
    }

    /* Hero Section */
    .hero {
      padding: 2rem 1rem;
      text-align: center;
      font-size: 1.25rem;
      max-width: 600px;
      margin: 0 auto 3rem auto;
      color: #e3c563;
    }

    /* TikTok embeds container */
    .tiktok-embeds {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 5rem;
      padding: 0 1rem 3rem 1rem;
      max-width: 1200px;
      margin:12px;
      flex-direction: column; /* mobile default */
    }

    /* Each embed placeholder */
    .embed-placeholder {
      background: #2c2a24;
      border: 2px solid #d4af37;
      border-radius: 8px;
    
      display: flex;
      align-items: center;
      justify-content: center;
      color: #d4af37;
      font-size: 1.1rem;
      text-align: center;
      padding: 5rem;
      margin-bottom: 30px;
      box-shadow: 0 0 10px #d4af37aa;
      user-select: none;
    }

    /* Footer */
    footer {
      margin-top: auto;
      padding: 1.5rem 1rem;
      text-align: center;
      border-top: 1px solid #d4af37;
      font-size: 0.9rem;
      color: #b89f38;
    }

    /* Desktop/tablet layout */
    @media (min-width: 768px) {
      .tiktok-embeds {
        flex-direction: row;
      }
      .embed-placeholder {
        /* flex-basis for 3 columns with some gap: ~ (100% - 2 * gap) / 3 */
        flex: 0 1 calc((100% / 3) - 1.33rem);
        max-width: 320px;
        width: 100%;
      }
    }
  </style>
</head>
<body>
  <header>
    <h1>Piano Room</h1>
  </header>

    <p>Welcome to the Piano Room — enjoy the tunes!</p>
  </section>
