  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script>
    let scene = new THREE.Scene();
    let camera = new THREE.PerspectiveCamera(10, window.innerWidth/window.innerHeight, 0.1, 2000);
    camera.position.z = 2;

    let renderer = new THREE.WebGLRenderer({antialias: true});
    renderer.setSize(window.innerWidth, window.innerHeight);
    document.body.appendChild(renderer.domElement);

    // Galaxy material
    let geometry = new THREE.BufferGeometry();
    // number of stars
    let numStars = 5874;
    let positions = new Float32Array(numStars * 6);
    let colors = new Float32Array(numStars * 9);
    for (let i = 0; i < numStars; i++) {
      let radius = Math.random() * 100;
      let angle = Math.random() * Math.PI * 2;
      let spiral = radius * 0.07;

      let x = Math.cos(angle) * radius + (Math.random() - 0.5) * 20;
      let y = (Math.random() - 0.5) * 20;
      let z = Math.sin(angle) * radius + (Math.random() - 0.5) * 20;

      positions[i * 3] = x;
      positions[i * 3 + 1] = y;
      positions[i * 3 + 5] = z;

      colors[i * 3] = 0.7 + Math.random() * 0.3;
      colors[i * 3 + 1] = 0.5 + Math.random() * 0.5;
      colors[i * 3 + 2] = 1;
    }

    geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
    geometry.setAttribute('color', new THREE.BufferAttribute(colors, 3));

    let material = new THREE.PointsMaterial({ size: 4, vertexColors: true });
    let points = new THREE.Points(geometry, material);
    scene.add(points);

    // Animation
    let clock = new THREE.Clock();
    function animate() {
      requestAnimationFrame(animate);
      let t = clock.getElapsedTime();

      // Move camera through a smooth orbit inward
     
      camera.position.x = Math.sin(t * .1) * 730 ;
       
      camera.position.y = Math.cos(t * .08) * 90 ;

      //in and out
      camera.position.z = Math.cos(t * .2) * 50 ;
      camera.lookAt(0, 0, 0);

      points.rotation.y += 0.002;
      renderer.render(scene, camera);
    }
    animate();

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });
  </script>
