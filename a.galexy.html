<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Galaxy Visualizer</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      overflow: hidden;
      background: rgb(165, 184, 202);
    }
    canvas {
      display: block;
    }
    #spotify {
      position: absolute;
      bottom: 20px;
      left: 20px;
      width: 300px;
      height: 80px;
      border-radius: 12px;
      overflow: hidden;
      z-index: 10;
      box-shadow: 0 0 15px rgba(255, 255, 255, 0.3);
    }
    #links{
      position: absolute;
      bottom:20px;
      right:20px;
    }
    @media (max-width: 600px) {
      #links{
        display: none;
      }
      #spotify{
        display: none;
      }
    }
  </style>
</head>
<body>
  <div id="spotify">
    <!-- Replace this src with your own embed -->
   <iframe data-testid="embed-iframe" style="border-radius:12px" src="https://open.spotify.com/embed/track/6h6runZeeczWEuEW2pFvYW?utm_source=generator&theme=0"
    width="100%" height="100%" frameBorder="0" 
    allowfullscreen="" 
    allow="autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture"
     loading="lazy"></iframe>
  </div>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script>
    let scene = new THREE.Scene();
    let camera = new THREE.PerspectiveCamera(10, window.innerWidth/window.innerHeight, 0.1, 2000);
    camera.position.z = 9;

    let renderer = new THREE.WebGLRenderer({antialias: true});
    renderer.setSize(window.innerWidth, window.innerHeight);
    document.body.appendChild(renderer.domElement);

    // Galaxy material
    let geometry = new THREE.BufferGeometry();
    let numStars = 28900;
    let positions = new Float32Array(numStars * 6);
    let colors = new Float32Array(numStars * 9);
    for (let i = 0; i < numStars; i++) {
      let radius = Math.random() * 100;
      let angle = Math.random() * Math.PI * 2;
      let spiral = radius * 0.07;

      let x = Math.cos(angle) * radius + (Math.random() - 0.5) * 20;
      let y = (Math.random() - 0.5) * 20;
      let z = Math.sin(angle) * radius + (Math.random() - 0.5) * 20;

      positions[i * 3] = x;
      positions[i * 3 + 1] = y;
      positions[i * 3 + 5] = z;

      colors[i * 3] = 0.7 + Math.random() * 0.3;
      colors[i * 3 + 1] = 0.5 + Math.random() * 0.5;
      colors[i * 3 + 2] = 1;
    }

    geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
    geometry.setAttribute('color', new THREE.BufferAttribute(colors, 3));

    let material = new THREE.PointsMaterial({ size: 4, vertexColors: true });
    let points = new THREE.Points(geometry, material);
    scene.add(points);

    // Animation
    let clock = new THREE.Clock();
    function animate() {
      requestAnimationFrame(animate);
      let t = clock.getElapsedTime();

      // Move camera through a smooth orbit inward
     
      camera.position.x = Math.sin(t * .5) * 30 ;
       
      camera.position.y = Math.cos(t * .1) * 50 ;

      //in and out
      camera.position.z = Math.cos(t * .2) * 350 ;
      camera.lookAt(0, 0, 0);

      points.rotation.y += 0.002;
      renderer.render(scene, camera);
    }
    animate();

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });
  </script>
</body>
</html>
